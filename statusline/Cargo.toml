[package]
name = "claude-statusline"
version = "0.1.0"
edition = "2024"
description = "Claude Code main status line (Rust port of statusline.py)"
publish = false

[[bin]]
name = "statusline"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
