# Rolling release: every push to main that touches the Rust build re-publishes
# the binaries on the `latest` release, which `statusline update` fetches.
name: release

on:
  push:
    branches: [main]
    paths: [statusline/src/**, statusline/Cargo.toml, Cargo.toml, Cargo.lock, .github/workflows/release.yml]
  workflow_dispatch:

# Read-only by default; only `publish` can write, and actions are pinned to
# commits so a moved tag can't change what runs with that token.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: statusline-macos-aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: statusline-macos-x86_64 }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: statusline-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: statusline-linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/statusline ${{ matrix.asset }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: |
          gh release view latest >/dev/null 2>&1 ||
            gh release create latest --title latest --notes "Rolling build of main." --target "$GITHUB_SHA"
          gh release upload latest dist/* --clobber
